[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ALOTT-MEDS"
# The last released version. A release bumps it with `uv version --bump` and tags the commit with
# the result (see RELEASING.md); CI refuses a tag that differs from it. 0.0.0 = nothing released yet.
version = "0.0.1"
authors = [
  { name="Robin van de Water", email="rpv2114@cumc.columbia.edu" },
]
description = "An ETL pipeline to extract the ALOTT (Carescape) EMR data into the MEDS format."
readme = "README.md"
# Mirrors MEDS-Extract's own floor and ceiling; a looser range admits interpreters it
# cannot be installed on, and uv refuses to resolve at all.
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# This package ships no Python: the whole ETL is `event_configs.yaml`, run by
# MEDS-Extract's own `meds-extract-run`. So there is exactly one dependency — the
# `[download]` extra adds `meds-extract-download`, which the runner spawns to stage the
# raw data from PhysioNet. MEDS-transforms, polars and hydra all arrive through it at the
# versions it fences; duplicating those pins here would only create drift.
dependencies = [
    "meds-extract[download]>=0.7.1,<0.8",
]

[dependency-groups]
# `shfmt-py` bundles the `shfmt` binary that the `mdformat-shfmt` pre-commit hook shells
# out to, keeping local + CI behavior in lock step.
dev = [
    "pre-commit~=3.8",
    "ruff>=0.11,<1.0",
    "pytest~=9.0",
    "shfmt-py==3.12.0.2",
]

[project.entry-points."MEDS_extract.pipelines"]
ALOTT = "ALOTT_MEDS:event_configs.yaml"

[project.urls]
Homepage = "https://github.com/rvandewater/ALOTT_MEDS"
Issues = "https://github.com/rvandewater/ALOTT_MEDS/issues"

[tool.setuptools.package-data]
# The MESSY spec is the whole ETL. It is not a Python file, so it has to be listed, or installed
# wheels lack it.
ALOTT_MEDS = ["event_configs.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary operator suggestions
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
