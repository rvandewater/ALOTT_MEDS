[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ALOTT-MEDS"
# The last released version. A release bumps it with `uv version --bump` and tags the commit with
# the result (see RELEASING.md); CI refuses a tag that differs from it. 0.0.0 = nothing released yet.
version = "0.1.0"
authors = [
  { name="Robin van de Water", email="rpv2114@cumc.columbia.edu" },
]
description = "An ETL pipeline to extract the ALOTT (Carescape) EMR data into the MEDS format."
readme = "README.md"
# Mirrors MEDS-Extract's own floor and ceiling; a looser range admits interpreters it
# cannot be installed on, and uv refuses to resolve at all.
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# The whole ETL is `event_configs.yaml`, run by MEDS-Extract's own `meds-extract-run`; the only
# Python is one small unit pre-stage (`alott_unit_keys`). 0.9.0 is the first
# MEDS-Extract that writes `unit` in `metadata/codes.parquet` as one String per code (stripped, blanks
# dropped, several distinct units on a code an error; MEDS_extract#336); 0.8.1 was the first that
# runs the extension stages a spec declares (`etl.pre_stages`, `etl.post_stages`) and writes the
# `etl:` descriptors and extension-column categories into `metadata/dataset.json`. It is capped below the next minor because its 0.x
# minors are breaking (MESSY syntax, runner CLI), so raise it deliberately when migrating. Its
# `[download]` extra adds `meds-extract-download`, which the runner spawns to stage the raw data
# from PhysioNet. suMEDS 0.6.2 registers the `sumeds_enrich` stage the spec declares, which
# enriches the code metadata with the rules registered below, soft-fails (a site without internet
# still gets its ETL) and records in `metadata/dataset.json` whether the build was enriched; 0.6.6
# registers the `sumeds_link_unit_siblings` post-stage, which links codes that differ only in their
# unit (it replaced this package's own `alott_unit_metadata`). suMEDS is
# capped below the next minor for the same reason (its rules format and CLI are still 0.x).
# MEDS-transforms, polars and hydra all arrive through these two at the versions they fence;
# duplicating those pins here would only create drift.
dependencies = [
    "meds-extract[download]>=0.9.0,<0.10",
    "sumeds>=0.6.7,<0.7",
]

[dependency-groups]
# `shfmt-py` bundles the `shfmt` binary that the `mdformat-shfmt` pre-commit hook shells
# out to, keeping local + CI behavior in lock step.
dev = [
    "pre-commit~=3.8",
    "ruff>=0.11,<1.0",
    "pytest~=9.0",
    "shfmt-py==3.12.0.2",
]

# Registers the spec with MEDS-Extract's generic runner, so `meds-extract-run spec=ALOTT` runs
# the whole ETL.
[project.entry-points."MEDS_extract.pipelines"]
ALOTT = "ALOTT_MEDS:event_configs.yaml"

# Registers the unit pre-stage the spec declares, `alott_unit_keys`, which finds the medication codes
# whose rows have more than one dose unit (those codes end in the unit).
[project.entry-points."MEDS_transforms.stages"]
alott_unit_keys = "ALOTT_MEDS.unit_keys:main"

# Registers the suMEDS rules under the same name, so the spec's `sumeds_enrich` stage and
# `--rules ALOTT` find them.
[project.entry-points."sumeds.rules"]
ALOTT = "ALOTT_MEDS:sumeds_rules.yaml"

# DRAFT ONLY: suMEDS from the branch that adds `sumeds.testing` (rvandewater/suMEDS, branch
# `testing-module`), whose contract tests tests/ use. Once that is released, this table goes and the
# pin above becomes `sumeds>=<that release>,<0.7`.
[tool.uv.sources]
sumeds = { git = "https://github.com/rvandewater/suMEDS", branch = "testing-module" }

[project.urls]
Homepage = "https://github.com/rvandewater/ALOTT_MEDS"
Issues = "https://github.com/rvandewater/ALOTT_MEDS/issues"

[tool.setuptools.package-data]
# The MESSY spec is the whole ETL, and `sumeds_rules.yaml` holds the rules suMEDS uses to enrich
# its code metadata. Neither is a Python file, so they have to be listed, or installed wheels lack them.
ALOTT_MEDS = ["event_configs.yaml", "sumeds_rules.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary operator suggestions
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
