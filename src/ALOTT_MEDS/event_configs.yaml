# The complete ALOTT MEDS ETL. This one file *is* the package: `sources:` says where the raw
# data comes from, `etl:` supplies the handful of run knobs, and every other top-level key is
# a raw table whose events are extracted from it. It is registered with `meds-extract-run`
# under the name `ALOTT` (see this repo's `pyproject.toml`), so the whole ETL is one command:
#
#     meds-extract-run spec=ALOTT output_dir=$MEDS_OUTPUT_DIR
#
# Only the EMR tables (`emr-datasets/`) are extracted. The telemetry folders (alarms,
# 2-second measurements, WFDB waveforms) are per-admission files whose subject and encounter
# IDs live in the *file name*, not in a column, and they are several orders of magnitude
# larger; they are out of scope for this spec.
#
# SCHEMA PROVENANCE. The table and column names below were checked against the ten EMR CSVs
# of the 1.0.0 release (`admission.csv`, `labs.csv`, ...). They differ from the dataset
# authors' release code (github.com/johnclawrence/Carescape): the published files use
# `aMRN`/`aCSN` as keys and carry each timestamp in a single already-shifted column. The
# name of the folder the EMR CSVs sit in on PhysioNet (`emr-datasets/` here) has not been
# checked against a download.
#
# Date shifting: every patient's dates are shifted by a random -180..180 days, time of day is
# not. Most timestamps are `%Y-%m-%d %H:%M:%S`; labs, orders and medication start/end carry
# only a shifted *date*, so their events are placed at the end of that day (23:59:59).
# Midnight would make a result visible before it existed (future leakage for any prediction
# made later that day).

etl:
  dataset_name: ALOTT
  n_subjects_per_shard: 10000

# `aMRN` is the de-identified patient key; `aCSN` is the de-identified encounter key, carried
# as `hadm_id` wherever a table has one.
_defaults:
  subject_id: $aMRN

emr-datasets/admission:
  # One row per hospital visit.
  admission:
    code: f"HOSPITAL_ADMISSION//{$Admission_Type ?? 'UNK'}//{$Admit_Source ?? 'UNK'}"
    time: '$admsnOffset::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    text_value: $REASON_VISIT_NAME
    _metadata:
      _self:
        description: >-
          f"Hospital admission; admission type {$Admission_Type ?? 'UNK'} (ALOTT admission.Admission_Type),
          admitted from {$Admit_Source ?? 'UNK'} (admission.Admit_Source)"
  discharge:
    code: f"HOSPITAL_DISCHARGE//{$Discharge_Destination ?? 'UNK'}"
    time: '$dischOffset::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    _metadata:
      _self:
        description: >-
          f"Hospital discharge; discharged to {$Discharge_Destination ?? 'UNK'} (ALOTT
          admission.Discharge_Destination)"
  # Diagnoses are only known at the end of the visit, so they are timed at discharge (as in
  # MIMIC-IV MEDS). The free-text name rides in `text_value` rather than `description`: it is
  # per-visit text, not guaranteed to be a function of the code. No `_metadata` at all (no
  # description, no `parent_codes`): the same ICD code occurs in several of the blocks below,
  # and MEDS-Extract refuses a code produced by two metadata-carrying code templates. The codes
  # are already dotted ICD-10-CM, so `DIAGNOSIS//ICD//10//<code>` maps to `ICD10CM/<code>`
  # directly.
  #
  # About 4% of cells hold a `, `-separated list of up to four codes. MESSY cannot explode a
  # list into rows, so each position is its own block: `_k` extracts the k-th code and yields
  # no event when the list is shorter. The full diagnosis text rides on every one. The blocks
  # run from the 4th position down because MESSY-synth builds its synthetic value from the
  # first pattern it meets, and only a 4-code list satisfies all four.
  primary_diagnosis_4: &primary_diagnosis
    code: f"DIAGNOSIS//ICD//10//{extract group 1 of /^[^,]+, [^,]+, [^,]+, ([^,]+)/ from $Primary_ICD10}"
    time: '$dischOffset::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    text_value: $Primary_Diagnosis
    diagnosis_rank: "'PRIMARY'"
  primary_diagnosis_3:
    <<: *primary_diagnosis
    code: f"DIAGNOSIS//ICD//10//{extract group 1 of /^[^,]+, [^,]+, ([^,]+)/ from $Primary_ICD10}"
  primary_diagnosis_2:
    <<: *primary_diagnosis
    code: f"DIAGNOSIS//ICD//10//{extract group 1 of /^[^,]+, ([^,]+)/ from $Primary_ICD10}"
  primary_diagnosis:
    <<: *primary_diagnosis
    code: f"DIAGNOSIS//ICD//10//{extract group 1 of /^([^,]+)/ from $Primary_ICD10}"
  secondary_diagnosis_4: &secondary_diagnosis
    code: f"DIAGNOSIS//ICD//10//{extract group 1 of /^[^,]+, [^,]+, [^,]+, ([^,]+)/ from $Secondary_ICD10}"
    time: '$dischOffset::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    text_value: $Secondary_Diagnosis
    diagnosis_rank: "'SECONDARY'"
  secondary_diagnosis_3:
    <<: *secondary_diagnosis
    code: f"DIAGNOSIS//ICD//10//{extract group 1 of /^[^,]+, [^,]+, ([^,]+)/ from $Secondary_ICD10}"
  secondary_diagnosis_2:
    <<: *secondary_diagnosis
    code: f"DIAGNOSIS//ICD//10//{extract group 1 of /^[^,]+, ([^,]+)/ from $Secondary_ICD10}"
  secondary_diagnosis:
    <<: *secondary_diagnosis
    code: f"DIAGNOSIS//ICD//10//{extract group 1 of /^([^,]+)/ from $Secondary_ICD10}"

emr-datasets/demographics:
  # Subject-level properties, so static (null time). The table is keyed per encounter, so a
  # subject contributes one row per visit; identical static events are deduplicated
  # downstream. Nulls are deliberately not coalesced: a missing demographic produces no
  # event rather than a `RACE//UNK` code that would read as an observed category.
  gender:
    code: f"GENDER//{$Gender}"
    time: null
    _metadata:
      _self:
        description: >-
          f"Patient sex/gender: {$Gender} (ALOTT demographics.Gender)"
  marital_status:
    code: f"MARITAL_STATUS//{$Marital_Status}"
    time: null
    _metadata:
      _self:
        description: >-
          f"Patient marital status: {$Marital_Status} (ALOTT demographics.Marital_Status)"
  race:
    code: f"RACE//{$Patient_Race}"
    time: null
    _metadata:
      _self:
        description: >-
          f"Patient-reported race: {$Patient_Race} (ALOTT demographics.Patient_Race)"
  ethnicity:
    code: f"ETHNICITY//{$Ethnicity}"
    time: null
    _metadata:
      _self:
        description: >-
          f"Patient-reported ethnicity: {$Ethnicity} (ALOTT demographics.Ethnicity)"
  language:
    code: f"LANGUAGE//{$Preferred_Language}"
    time: null
    _metadata:
      _self:
        description: >-
          f"Patient preferred language: {$Preferred_Language} (ALOTT demographics.Preferred_Language)"
  blood_type:
    code: f"BLOOD_TYPE//{$ABO_RH_Blood_Type}"
    time: null
    _metadata:
      _self:
        description: >-
          f"Patient ABO/Rh blood type: {$ABO_RH_Blood_Type} (ALOTT demographics.ABO_RH_Blood_Type)"

emr-datasets/allergy:
  # The release carries no time for allergies, so they are static.
  allergy:
    code: f"ALLERGY//{$Allergy}"
    time: null
    text_value: $Allergy_Reaction
    _metadata:
      _self:
        description: >-
          f"Recorded allergy; allergen: {$Allergy} (ALOTT allergy.Allergy)"

emr-datasets/flowsheet:
  # Provider-charted vitals, risk scores and rapid-response events. `MEAS_VALUE` is free
  # text; `::?float64` keeps the numeric reading where there is one and null otherwise.
  # Scored scale items are charted as `<score>--><label>` (e.g. `-1-->Drowsy`), so their
  # leading score is the numeric reading. The raw string is kept in `text_value` unless it is
  # just the number (MEDS-Extract drops a `text_value` equal to `numeric_value`).
  flowsheet:
    code: f"FLOWSHEET//{$FLO_MEAS_ID}"
    time: '$recordedOffsetDate::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    numeric_value: coalesce($MEAS_VALUE::?float64, (extract group 1 of /^(-?[0-9]+)-->/ from $MEAS_VALUE::str)::?float64)
    text_value: $MEAS_VALUE
    flow_type: $Flow_Type
    _metadata:
      _self:
        description: coalesce($disp_name, $flo_meas_name)

emr-datasets/icu:
  # The release keeps only the ICU stay's times, not which unit it was.
  #
  # These three codes are constants, but MEDS-Extract 0.7 attaches `_metadata` only to a code
  # whose expression references a source column (mmcdermott/MEDS_extract#166), so each is
  # guarded by its own time column: `if $t == $t` is false only where `$t` is null, and such
  # a row produces no event anyway. The guard changes no event; it gives the code a component
  # for its description to attach to.
  icu_admission:
    code: "'ICU_ADMISSION' if $startOffsetDate == $startOffsetDate"
    time: '$startOffsetDate::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    _metadata:
      _self:
        description: "'Start of an ICU stay; the release does not record the unit (ALOTT icu.startOffsetDate)'"
  icu_discharge:
    code: "'ICU_DISCHARGE' if $endOffsetDate == $endOffsetDate"
    time: '$endOffsetDate::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    _metadata:
      _self:
        description: "'End of an ICU stay; the release does not record the unit (ALOTT icu.endOffsetDate)'"

emr-datasets/location:
  # Bed-level movement. The release keeps only each stay's start and end, not the department,
  # room or bed, so a transfer is just the moment the patient moved. Guarded like the ICU codes.
  transfer:
    code: "'TRANSFER' if $startOffsetDate == $startOffsetDate"
    time: '$startOffsetDate::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    _metadata:
      _self:
        description: >-
          'Start of a bed stay (the patient moved into a bed); the release does not record the
          department, room or bed (ALOTT location.startOffsetDate)'

emr-datasets/medications:
  # One row per administration, each repeating its order's start and end. Those two are
  # datetimes in form but always 00:00:00 in the release, i.e. dates, so they are placed at
  # the end of the day like labs and orders. The ordered dose is free text (`1-2` for a
  # range); its numeric reading is kept where there is one and the raw string otherwise.
  medication_start:
    code: f"MEDICATION//START//{$MEDICATION}"
    time: '$startOffsetDate::"%Y-%m-%d %H:%M:%S" @ 23:59:59'
    hadm_id: $aCSN
    numeric_value: $HV_DISCRETE_DOSE::?float64
    text_value: $HV_DISCRETE_DOSE
    dose_unit: $HV_DISCRET_DOSE_UNIT
    frequency: $FREQUENCY
    _metadata:
      _self:
        description: >-
          f"Medication order start: {$MEDICATION} (ALOTT medications.MEDICATION)"
  medication_stop:
    code: f"MEDICATION//STOP//{$MEDICATION}"
    time: '$endOffsetDate::"%Y-%m-%d %H:%M:%S" @ 23:59:59'
    hadm_id: $aCSN
    _metadata:
      _self:
        description: >-
          f"Medication order end: {$MEDICATION} (ALOTT medications.MEDICATION)"
  # The Medication Administration Record (MAR), the bedside log of each dose, is the only
  # medication time with a time of day. The recorded action is part of the code, since a held
  # or refused dose is not a given one; a row without an action is kept as `UNK`.
  medication_administration:
    code: f"MEDICATION//MAR//{$MEDICATION}//{$MAR_ACTION ?? 'UNK'}"
    time: '$OffsetMAR_TAKEN_TIME::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    numeric_value: $MAR_DOSE::?float64
    dose_unit: $MAR_DOSE_UNIT
    route: $MAR_ROUTE
    _metadata:
      _self:
        description: >-
          f"Medication administration record (MAR) entry: {$MEDICATION} (ALOTT medications.MEDICATION),
          action {$MAR_ACTION ?? 'UNK'} (medications.MAR_ACTION)"

emr-datasets/labs:
  # Ordering and resulting encounters can differ; the resulting one is the visit the value
  # belongs to. Unresulted rows carry the string `nan` as their resulting encounter, which the
  # lenient cast turns into a null (and keeps `hadm_id` an integer across tables). The end-of-day
  # time is attached with `date @ time` rather than an f-string so MESSY-synth can type the column.
  lab_ordered:
    code: f"LAB//ORDERED//{$PROC_ID}"
    time: '$orderingOffsetDate::"%Y-%m-%d" @ 23:59:59'
    hadm_id: $ordering_aCSN
    _metadata:
      _self:
        description: $DESCRIPTION
  lab_result:
    code: f"LAB//RESULT//{$PROC_ID}//{$COMPONENT_NAME ?? 'UNK'}"
    time: '$resultsOffsetDate::"%Y-%m-%d" @ 23:59:59'
    hadm_id: $resulting_aCSN::?int64
    numeric_value: "$ORD_NUM_VALUE::?float64 if $ORD_NUM_VALUE::?float64 != 9999999"
    text_value: $ORD_VALUE
    order_status: $order_status
    _metadata:
      _self:
        description: f"{$DESCRIPTION} - {$COMPONENT_NAME}"

emr-datasets/orders:
  # Every order type except labs. About half the rows carry a single result, with the same
  # `nan` resulting-encounter and 9999999 nonnumeric sentinels as labs.
  order:
    code: f"ORDER//ORDERED//{$Order_type ?? 'UNK'}//{$PROC_ID}"
    time: '$orderingOffsetDate::"%Y-%m-%d" @ 23:59:59'
    hadm_id: $ordering_aCSN
    order_status: $order_status
    _metadata:
      _self:
        description: $DESCRIPTION
  order_result:
    code: f"ORDER//RESULT//{$Order_type ?? 'UNK'}//{$PROC_ID}"
    time: '$resultsOffsetDate::"%Y-%m-%d" @ 23:59:59'
    hadm_id: $resulting_aCSN::?int64
    numeric_value: "$ORD_NUM_VALUE::?float64 if $ORD_NUM_VALUE::?float64 != 9999999"
    text_value: $ORD_VALUE
    order_status: $order_status
    _metadata:
      _self:
        description: $DESCRIPTION

# `emr-datasets/social_hx` (tobacco / alcohol / drug use) is not extracted: it has no event
# time other than quit dates, and its `*_C` columns are Epic category codes whose labels are
# not in the release.

sources:
  # Stamped by `meds-extract-run` into the output's `etl_metadata.dataset_version` as
  # `<release>:<this package's version>`.
  dataset_version: "1.0.0"
  dataset:
    - type: physionet
      base_url: https://physionet.org/files/alott/${sources.dataset_version}
      username: ${oc.env:DATASET_DOWNLOAD_USERNAME}
      password: ${oc.env:DATASET_DOWNLOAD_PASSWORD}
      # Only the EMR tables; the telemetry is out of scope (see the header).
      include: ["emr-datasets/*"]
