# The complete ALOTT MEDS ETL. This one file *is* the package: `sources:` says where the raw
# data comes from, `etl:` supplies the handful of run knobs, and every other top-level key is
# a raw table whose events are extracted from it. It is registered with `meds-extract-run`
# under the name `ALOTT` (see this repo's `pyproject.toml`), so the whole ETL is one command:
#
#     meds-extract-run spec=ALOTT output_dir=$MEDS_OUTPUT_DIR
#
# Only the EMR tables (`emr-datasets/`) are extracted. The telemetry folders (alarms,
# 2-second measurements, WFDB waveforms) are per-admission files whose subject and encounter
# IDs live in the *file name*, not in a column, and they are several orders of magnitude
# larger; they are out of scope for this spec.
#
# SCHEMA PROVENANCE. The table and column names below were checked against the ten EMR CSVs
# of the 1.0.0 release (`admission.csv`, `labs.csv`, ...). They differ from the dataset
# authors' release code (github.com/johnclawrence/Carescape): the published files use
# `aMRN`/`aCSN` as keys and carry each timestamp in a single already-shifted column. The
# name of the folder the EMR CSVs sit in on PhysioNet (`emr-datasets/` here) has not been
# checked against a download.
#
# Date shifting: every patient's dates are shifted by a random -180..180 days, time of day is
# not. Most timestamps are `%Y-%m-%d %H:%M:%S`; labs and orders carry only a shifted *date*,
# so their events are placed at the end of that day (23:59:59). Midnight would make a result
# visible before it existed (future leakage for any prediction made later that day).

etl:
  dataset_name: ALOTT
  n_subjects_per_shard: 10000

# `aMRN` is the de-identified patient key; `aCSN` is the de-identified encounter key, carried
# as `hadm_id` wherever a table has one.
_defaults:
  subject_id: $aMRN

emr-datasets/admission:
  # One row per hospital visit.
  admission:
    code: f"HOSPITAL_ADMISSION//{$Admission_Type ?? 'UNK'}//{$Admit_Source ?? 'UNK'}"
    time: '$admsnOffset::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    text_value: $REASON_VISIT_NAME
  discharge:
    code: f"HOSPITAL_DISCHARGE//{$Discharge_Destination ?? 'UNK'}"
    time: '$dischOffset::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
  # Diagnoses are only known at the end of the visit, so they are timed at discharge (as in
  # MIMIC-IV MEDS). The free-text name rides in `text_value` rather than `description`: it is
  # per-visit text, not guaranteed to be a function of the code. No `parent_codes` metadata:
  # the same ICD code occurs in both columns, and MEDS-Extract refuses a code produced by two
  # code templates. The codes are already dotted ICD-10-CM, so `DIAGNOSIS//ICD//10//<code>`
  # maps to `ICD10CM/<code>` directly.
  primary_diagnosis:
    code: f"DIAGNOSIS//ICD//10//{$Primary_ICD10}"
    time: '$dischOffset::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    text_value: $Primary_Diagnosis
    diagnosis_rank: "'PRIMARY'"
  secondary_diagnosis:
    code: f"DIAGNOSIS//ICD//10//{$Secondary_ICD10}"
    time: '$dischOffset::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    text_value: $Secondary_Diagnosis
    diagnosis_rank: "'SECONDARY'"

emr-datasets/demographics:
  # Subject-level properties, so static (null time). The table is keyed per encounter, so a
  # subject contributes one row per visit; identical static events are deduplicated
  # downstream. Nulls are deliberately not coalesced: a missing demographic produces no
  # event rather than a `RACE//UNK` code that would read as an observed category.
  gender:
    code: f"GENDER//{$Gender}"
    time: null
  marital_status:
    code: f"MARITAL_STATUS//{$Marital_Status}"
    time: null
  race:
    code: f"RACE//{$Patient_Race}"
    time: null
  ethnicity:
    code: f"ETHNICITY//{$Ethnicity}"
    time: null
  language:
    code: f"LANGUAGE//{$Preferred_Language}"
    time: null
  blood_type:
    code: f"BLOOD_TYPE//{$ABO_RH_Blood_Type}"
    time: null

emr-datasets/allergy:
  # The release carries no time for allergies, so they are static.
  allergy:
    code: f"ALLERGY//{$Allergy}"
    time: null
    text_value: $Allergy_Reaction

emr-datasets/flowsheet:
  # Provider-charted vitals, risk scores and rapid-response events. `MEAS_VALUE` is free
  # text; `::?float64` keeps the numeric reading where there is one and null otherwise, and
  # the raw string is always kept in `text_value`.
  flowsheet:
    code: f"FLOWSHEET//{$FLO_MEAS_ID}"
    time: '$recordedOffsetDate::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    numeric_value: $MEAS_VALUE::?float64
    text_value: $MEAS_VALUE
    flow_type: $Flow_Type
    _metadata:
      _self:
        description: coalesce($disp_name, $flo_meas_name)

emr-datasets/icu:
  # The release keeps only the ICU stay's times, not which unit it was.
  icu_admission:
    code: "'ICU_ADMISSION'"
    time: '$startOffsetDate::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
  icu_discharge:
    code: "'ICU_DISCHARGE'"
    time: '$endOffsetDate::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN

emr-datasets/location:
  # Bed-level movement. The release keeps only each stay's start and end, not the department,
  # room or bed, so a transfer is just the moment the patient moved.
  transfer:
    code: "'TRANSFER'"
    time: '$startOffsetDate::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN

emr-datasets/medications:
  # Administrations (`OffsetMAR_TAKEN_TIME`) are not emitted yet.
  medication_start:
    code: f"MEDICATION//START//{$MEDICATION}"
    time: '$startOffsetDate::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN
    numeric_value: $HV_DISCRETE_DOSE::?float64
    dose_unit: $HV_DISCRET_DOSE_UNIT
    frequency: $FREQUENCY
    route: $MAR_ROUTE
  medication_stop:
    code: f"MEDICATION//STOP//{$MEDICATION}"
    time: '$endOffsetDate::"%Y-%m-%d %H:%M:%S"'
    hadm_id: $aCSN

emr-datasets/labs:
  # Ordering and resulting encounters can differ; the resulting one is the visit the value
  # belongs to. Unresulted rows carry the string `nan` as their resulting encounter, which the
  # lenient cast turns into a null (and keeps `hadm_id` an integer across tables). The end-of-day
  # time is attached with `date @ time` rather than an f-string so MESSY-synth can type the column.
  lab_ordered:
    code: f"LAB//ORDERED//{$PROC_ID}"
    time: '$orderingOffsetDate::"%Y-%m-%d" @ 23:59:59'
    hadm_id: $ordering_aCSN
    _metadata:
      _self:
        description: $DESCRIPTION
  lab_result:
    code: f"LAB//RESULT//{$PROC_ID}//{$COMPONENT_NAME ?? 'UNK'}"
    time: '$resultsOffsetDate::"%Y-%m-%d" @ 23:59:59'
    hadm_id: $resulting_aCSN::?int64
    numeric_value: "$ORD_NUM_VALUE::?float64 if $ORD_NUM_VALUE != 9999999"
    text_value: $ORD_VALUE
    order_status: $order_status
    _metadata:
      _self:
        description: f"{$DESCRIPTION} - {$COMPONENT_NAME}"

emr-datasets/orders:
  order:
    code: f"ORDER//{$Order_type ?? 'UNK'}//{$PROC_ID}"
    time: '$orderingOffsetDate::"%Y-%m-%d" @ 23:59:59'
    hadm_id: $ordering_aCSN
    order_status: $order_status
    _metadata:
      _self:
        description: $DESCRIPTION

# `emr-datasets/social_hx` (tobacco / alcohol / drug use) is not extracted: it has no event
# time other than quit dates, and its `*_C` columns are Epic category codes whose labels are
# not in the release.

sources:
  # Stamped by `meds-extract-run` into the output's `etl_metadata.dataset_version` as
  # `<release>:<this package's version>`.
  dataset_version: "1.0.0"
  dataset:
    - type: physionet
      base_url: https://physionet.org/files/alott/${sources.dataset_version}
      username: ${oc.env:DATASET_DOWNLOAD_USERNAME}
      password: ${oc.env:DATASET_DOWNLOAD_PASSWORD}
      # Only the EMR tables; the telemetry is out of scope (see the header).
      include: ["emr-datasets/*"]
