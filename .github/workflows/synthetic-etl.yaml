name: Synthetic ETL for MESSY files using MESSY_synth

# Generates raw files straight from the shipped MESSY config with MESSY-synth and runs the ETL over
# them. MESSY-synth validates that every event block yields events and fails the job otherwise, so
# this catches expressions that only work on the dtypes of one particular release. It complements
# the hand-written fixture in tests/e2e_synthetic_test.py, which checks specific values.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev", "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        # MESSY-synth requires Python >= 3.12.
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate and extract synthetic data
        # MESSY-synth isn't a project dependency, so it runs in a tool environment of its own. It
        # reads a copy of the spec without the `etl:` keys new in MEDS-Extract 0.8.1 (the extension
        # stages and the dataset.json descriptors), which MESSY-synth 0.0.1 rejected; they don't
        # affect which raw columns the spec reads. The extraction runs the shipped spec, suMEDS
        # enrichment stage included, with this project's locked MEDS-Extract. MESSY-synth 0.1.0
        # targets MEDS-Extract 0.8 and reads the shipped spec as is, so the copy can be dropped.
        run: |
          awk '/^etl:/ { etl = 1; print; next } etl && /^[^ ]/ { etl = 0 } /^$/ { drop = 0 }
            etl && /^  [a-z_]+:/ { drop = $1 ~ /^(pre_stages|post_stages|license|location_uri|description_uri|raw_source_id_columns|code_modifier_columns|additional_value_modality_columns|site_id_columns):$/ }
            !(etl && drop)' ./src/ALOTT_MEDS/event_configs.yaml >event_configs_0.7.yaml
          uvx --python ${{ matrix.python-version }} --from "MESSY_synth==0.1.0" \
            MESSY-synth ./event_configs_0.7.yaml -o raw_synthetic/ --explain
          uv run --locked meds-extract-run spec=ALOTT output_dir=./ALOTT_meds_synth \
            input_dir=raw_synthetic do_download=false
          for f in dataset.json codes.parquet subject_splits.parquet; do
            test -f "ALOTT_meds_synth/metadata/$f"
          done
          # The stage ran and recorded the enrichment (or, without the packs, a soft failure).
          jq -e '.sumeds_enrichment.rules == "ALOTT"' ALOTT_meds_synth/metadata/dataset.json
