name: Tests

# This repo ships no Python — only `event_configs.yaml` and the entry-point registration
# naming it `ALOTT`. ALOTT is a credentialed PhysioNet release with no open demo, so CI
# cannot touch real data. It runs the spec end to end over a synthetic, ALOTT-shaped input
# generated by tests/e2e_synthetic_test.py instead: that catches broken expressions,
# column references and registration, but not drift between the spec and the published
# release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: "3.12"

      - name: Run the ETL over synthetic input
        run: uv run pytest tests/ -v --junitxml=junit.xml -s

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
